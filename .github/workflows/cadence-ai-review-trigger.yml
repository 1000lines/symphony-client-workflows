name: Cadence AI Review Trigger

# Event and manual callers invoke this reusable workflow directly. Keep the
# review-request entry point for existing integrations until they migrate.

on:
  pull_request_target:
    types: [review_requested, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review."
        required: true
        type: string
      trigger_source:
        description: "Why this review was triggered."
        required: false
        default: "workflow_dispatch"
        type: string
      trigger_actor:
        description: "GitHub actor that caused the trigger, when known."
        required: false
        default: ""
        type: string
  workflow_call:
    secrets:
      CADENCE_APP_PRIVATE_KEY:
        required: true
      CADENCE_OPENAI_API_KEY:
        required: false
      CADENCE_AI_REVIEW_ANTHROPIC_API_KEY:
        required: false
      CADENCE_LINEAR_API_TOKEN:
        required: false
    inputs:
      helpers-ref:
        description: "Reviewed symphony-client-workflows revision providing the trusted review helpers."
        type: string
        required: false
        default: main
      pr_number:
        required: true
        type: string
      trigger_source:
        required: false
        default: "workflow_call"
        type: string
      trigger_actor:
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  GH_REPO: ${{ github.repository }}
  REPO_SLUG: ${{ github.repository }}
  SYMPHONY_BOT_USER: ${{ vars.SYMPHONY_BOT_USER || 'example-symphony-bot' }}
  CADENCE_REVIEWER: ${{ vars.CADENCE_REVIEWER || 'example-cadence-bot' }}
  SYMPHONY_REPOSITORY_OWNER: ${{ vars.SYMPHONY_REPOSITORY_OWNER || github.repository_owner }}

jobs:
  reconcile-closed:
    name: Reconcile Linear after PR close
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Share the repository's non-review Linear mutation lock. Repository-scoped
    # Actions concurrency cannot serialize other repositories or Linear itself.
    concurrency:
      group: symphony-linear-wakeups-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out trusted close handler
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: 1000lines/symphony-client-workflows
          ref: ${{ inputs.helpers-ref || 'main' }}
          persist-credentials: false
      - name: Reconcile current PR associations
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          LINEAR_API_TOKEN: ${{ secrets.CADENCE_LINEAR_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const { createGitHubClient } = await import(`${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/symphony-linear-wakeups.mjs`);
            const { reconcilePrClose } = await import(`${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/symphony-pr-close.mjs`);
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const configuration = await createGitHubClient({ repo, token: process.env.GH_TOKEN }).configuration();
            const result = await reconcilePrClose({ github, repo, number: context.payload.pull_request.number,
              teamKey: configuration.config.linear.teamKey, linearToken: process.env.LINEAR_API_TOKEN });
            const eventClosedAt = context.payload.pull_request.closed_at;
            const eventToCompletionMs = Date.parse(result.completedAt) - Date.parse(eventClosedAt);
            const evidence = JSON.stringify({ ...result, configurationSha: configuration.revision,
              helperSha: require('node:child_process').execFileSync('git', ['rev-parse', 'HEAD'], { cwd: process.env.GITHUB_WORKSPACE, encoding: 'utf8' }).trim(),
              eventClosedAt: eventClosedAt || null, eventToCompletionMs: Number.isFinite(eventToCompletionMs) ? eventToCompletionMs : null,
              actor: context.actor, runUrl: `${context.serverUrl}/${repo}/actions/runs/${context.runId}`,
              runAttempt: process.env.GITHUB_RUN_ATTEMPT }, null, 2);
            core.info(evidence);
            await core.summary.addRaw(`### Linear close reconciliation: ${result.operation}\n\nThe independent cancel-closed job may still be queued; its completion does not gate this result.\n\n`).write();
            await core.summary.addRaw('<pre>' + evidence.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;') + '</pre>').write();
            if (result.operation === 'skipped') core.warning(result.reason);
            if (result.operation === 'failed') core.setFailed(result.reason);

  cancel-closed:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    concurrency:
      group: cadence-ai-review-${{ github.repository }}-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
      queue: single # Closing the PR replaces pending review work.
    steps:
      - run: echo "PR closed; cancelling its Cadence review."

  accept:
    name: "Accept PR #${{ inputs.pr_number || github.event.pull_request.number }}"
    if: >-
      ${{
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        (github.event_name != 'pull_request_target' ||
        (
          github.event.action == 'review_requested' &&
          github.event.pull_request.state == 'open' &&
          github.event.pull_request.user.login == (vars.SYMPHONY_BOT_USER || 'example-symphony-bot') &&
          github.event.requested_reviewer.login == (vars.CADENCE_REVIEWER || 'example-cadence-bot') &&
          (
            contains(github.event.pull_request.labels.*.name, 'symphony') ||
            github.actor == (vars.CADENCE_REVIEWER || 'example-cadence-bot')
          ) &&
          github.actor != 'claude[bot]' &&
          github.actor != 'dependabot[bot]' &&
          (
            github.actor == (vars.CADENCE_REVIEWER || 'example-cadence-bot') ||
            github.actor == (vars.SYMPHONY_BOT_USER || 'example-symphony-bot') ||
            github.event.sender.type == 'Bot' ||
            !endsWith(github.actor, '[bot]')
          )
        ))
      }}
    environment: cadence-controller
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cadence-check-publication-${{ github.repository }}-pr-${{ inputs.pr_number || github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max # Short admission/publication lock; never held during review.
    outputs:
      provider: ${{ steps.provider.outputs.provider }}
      request: ${{ steps.prepare.outputs.request }}
      check_id: ${{ steps.queued.outputs.check_id }}
    steps:
      - name: Select review provider
        id: provider
        env:
          CADENCE_OPENAI_API_KEY: ${{ secrets.CADENCE_OPENAI_API_KEY }}
          CADENCE_AI_REVIEW_ANTHROPIC_API_KEY: ${{ secrets.CADENCE_AI_REVIEW_ANTHROPIC_API_KEY }}
        run: |
          if [[ "${CADENCE_OPENAI_API_KEY}" =~ [^[:space:]] ]]; then
            echo 'provider=codex' >> "${GITHUB_OUTPUT}"
          elif [[ "${CADENCE_AI_REVIEW_ANTHROPIC_API_KEY}" =~ [^[:space:]] ]]; then
            echo 'provider=claude' >> "${GITHUB_OUTPUT}"
          else
            echo '::error::Configure CADENCE_OPENAI_API_KEY or CADENCE_AI_REVIEW_ANTHROPIC_API_KEY and explicitly forward it to the Cadence review workflow.'
            exit 1
          fi

      - name: Validate PR number
        env:
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          if ! printf '%s' "${PR_NUMBER}" | grep -Eq '^[0-9]+$'; then
            echo "::error::pr_number must be a positive integer."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: 1000lines/symphony-client-workflows
          ref: ${{ inputs.helpers-ref || 'main' }}
          persist-credentials: false

      - name: Mint existing Cadence App token
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.1
        with:
          app-id: ${{ vars.CADENCE_APP_ID }}
          private-key: ${{ secrets.CADENCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-metadata: read
          permission-pull-requests: write
          permission-checks: write

      # Token creation supplies the trusted App slug. Other App actors stop
      # here, before fetching feedback or performing review mutations.
      - name: Verify App review requester
        if: github.event_name == 'pull_request_target'
        env:
          REQUEST_ACTOR: ${{ github.actor }}
          REQUEST_ACTOR_TYPE: ${{ github.event.sender.type }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if [[ "${REQUEST_ACTOR_TYPE}" == "Bot" || "${REQUEST_ACTOR}" == *'[bot]' ]]; then
            if [[ -z "${APP_SLUG}" || "${REQUEST_ACTOR}" != "${APP_SLUG}[bot]" ]]; then
              echo "::error::Review request is not from the configured Cadence App."
              exit 1
            fi
          fi

      - name: Prepare durable check pointer
        id: prepare
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { checkRequest } = await import(`${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/cadence-review-check.mjs`);
            const number = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (pr.state !== 'open') return;
            const request = checkRequest({ repo: context.repo, serverUrl: context.serverUrl,
              runId: context.runId, runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT) }, number, pr.head.sha);
            const json = JSON.stringify(request);
            require('node:fs').writeFileSync(`${process.env.RUNNER_TEMP}/cadence-check-${number}.json`, json);
            core.setOutput('request', json);

      # Save before creating: even cancellation between API creation and output
      # publication leaves workflow_run enough information to finish the check.
      - name: Save check recovery pointer
        if: steps.prepare.outputs.request != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cadence-check-${{ github.run_attempt }}-${{ inputs.pr_number || github.event.pull_request.number }}
          path: ${{ runner.temp }}/cadence-check-${{ inputs.pr_number || github.event.pull_request.number }}.json
          if-no-files-found: error

      - name: Publish queued Cadence check
        id: queued
        if: steps.prepare.outputs.request != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          CHECK_REQUEST: ${{ steps.prepare.outputs.request }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { queueCheck } = await import(`${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/cadence-review-check.mjs`);
            const check = await queueCheck(github, JSON.parse(process.env.CHECK_REQUEST), '${{ vars.CADENCE_APP_ID }}');
            core.setOutput('check_id', check.id);
            const { publishRequestComment } = await import(`${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/cadence-review-comment.mjs`);
            core.info(JSON.stringify(await publishRequestComment(github, JSON.parse(process.env.CHECK_REQUEST), { id: '${{ vars.CADENCE_APP_ID }}', slug: '${{ steps.app-token.outputs.app-slug }}' })));

  review:
    name: "Review PR #${{ inputs.pr_number || github.event.pull_request.number }}"
    needs: accept
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.accept.outputs.check_id != ''
    concurrency:
      group: cadence-ai-review-${{ github.repository }}-pr-${{ inputs.pr_number || github.event.pull_request.number }}
      cancel-in-progress: false
      queue: single # Hold the review slot across start and assessment, not the publication lock.
    uses: ./.github/workflows/cadence-ai-review-run.yml
    with:
      helpers-ref: ${{ inputs.helpers-ref || 'main' }}
      pr_number: ${{ inputs.pr_number || format('{0}', github.event.pull_request.number) }}
      trigger_source: ${{ inputs.trigger_source || format('{0}.{1}', github.event_name, github.event.action) }}
      trigger_actor: ${{ inputs.trigger_actor || github.actor }}
      request: ${{ needs.accept.outputs.request }}
      provider: ${{ needs.accept.outputs.provider }}
    secrets:
      CADENCE_APP_PRIVATE_KEY: ${{ secrets.CADENCE_APP_PRIVATE_KEY }}
      CADENCE_OPENAI_API_KEY: ${{ secrets.CADENCE_OPENAI_API_KEY }}
      CADENCE_AI_REVIEW_ANTHROPIC_API_KEY: ${{ secrets.CADENCE_AI_REVIEW_ANTHROPIC_API_KEY }}
      CADENCE_LINEAR_API_TOKEN: ${{ secrets.CADENCE_LINEAR_API_TOKEN }}

  finish:
    name: "Publish Cadence result for PR #${{ inputs.pr_number || github.event.pull_request.number }}"
    needs: [accept, review]
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.accept.outputs.check_id != ''
    environment: cadence-controller
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub gates draft readiness on contents:write. Limit it to this trusted
    # repository job; the shared Cadence App has no contents-write grant.
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: cadence-check-publication-${{ github.repository }}-pr-${{ inputs.pr_number || github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out trusted helpers
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: 1000lines/symphony-client-workflows
          ref: ${{ inputs.helpers-ref || 'main' }}
          persist-credentials: false
      - name: Mint existing Cadence App token
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.1
        with:
          app-id: ${{ vars.CADENCE_APP_ID }}
          private-key: ${{ secrets.CADENCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-checks: write
      - name: Finish advisory check and hand clean drafts to humans
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          CHECK_REQUEST: ${{ needs.accept.outputs.request }}
          REVIEW_RESULT: ${{ needs.review.result }}
          RAN_REVIEW: ${{ needs.review.outputs.ran_review }}
          REVIEW_BASELINE: ${{ needs.review.outputs.baseline }}
          REVIEW_MEASUREMENTS: ${{ needs.review.outputs.measurements }}
          HANDOFF_TOKEN: ${{ github.token }}
          CADENCE_REVIEWER_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { finishCheck } = await import(`${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/cadence-review-check.mjs`);
            const handoffGithub = new github.constructor({ auth: process.env.HANDOFF_TOKEN, baseUrl: process.env.GITHUB_API_URL });
            const outcome = await finishCheck(github, JSON.parse(process.env.CHECK_REQUEST), '${{ vars.CADENCE_APP_ID }}', {
              result: process.env.REVIEW_RESULT, ranReview: process.env.RAN_REVIEW,
              baseline: process.env.REVIEW_BASELINE === '' ? undefined : Number(process.env.REVIEW_BASELINE),
              reviewer: process.env.CADENCE_REVIEWER_LOGIN,
              readyGraphql: handoffGithub.graphql,
            });
            const { publishRequestComment } = await import(`${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/cadence-review-comment.mjs`);
            core.info(JSON.stringify(await publishRequestComment(github, JSON.parse(process.env.CHECK_REQUEST), { id: '${{ vars.CADENCE_APP_ID }}', slug: '${{ steps.app-token.outputs.app-slug }}' }, { measurements: JSON.parse(process.env.REVIEW_MEASUREMENTS || '{}') })));
            if (outcome) await core.summary.addRaw(`${outcome.summary}\n`).write();
            if (outcome?.handoffError) core.setFailed(outcome.handoffError);
