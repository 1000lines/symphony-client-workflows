name: Cadence Review Handoff

on:
  workflow_run:
    workflows: [Cadence Review Ingress]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

env:
  SYMPHONY_BOT_USER: ${{ vars.SYMPHONY_BOT_USER || 'example-symphony-bot' }}
  CADENCE_REVIEWER: ${{ vars.CADENCE_REVIEWER || 'example-cadence-bot' }}
  SYMPHONY_REPOSITORY_OWNER: ${{ vars.SYMPHONY_REPOSITORY_OWNER || github.repository_owner }}

jobs:
  review-handoff:
    name: Route Cadence review handoff
    if: >-
      github.ref == 'refs/heads/main' && github.event.workflow_run.conclusion == 'success' &&
      fromJSON(github.event.workflow_run.display_title).eligible &&
      contains(fromJSON('["issue_comment","pull_request_review"]'), github.event.workflow_run.event)
    environment: cadence-controller
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cadence-review-handoff-${{ github.repository }}-${{ fromJSON(github.event.workflow_run.display_title).number }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          persist-credentials: false

      - name: Read current event from GitHub
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { resolveCadenceEvent } = await import(`${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/cadence-forwarded-event.mjs`);
            const { payload, eventName } = await resolveCadenceEvent({ github, context });
            const path = `${process.env.RUNNER_TEMP}/cadence-event.json`;
            require('node:fs').writeFileSync(path, JSON.stringify(payload));
            core.exportVariable('CADENCE_EVENT_PATH', path);
            core.exportVariable('CADENCE_EVENT_NAME', eventName);

      - name: Mint existing Cadence App token
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.1
        with:
          app-id: ${{ vars.CADENCE_APP_ID }}
          private-key: ${{ secrets.CADENCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-metadata: read
          permission-pull-requests: write

      - name: Route linked Linear issue or human review request
        env:
          CADENCE_REVIEWER_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          LINEAR_API_TOKEN: ${{ secrets.CADENCE_LINEAR_API_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/cadence-linear-rework.mjs
