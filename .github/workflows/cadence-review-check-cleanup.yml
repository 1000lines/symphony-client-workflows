name: Cadence Review Check Cleanup

on:
  workflow_call:
    secrets:
      CADENCE_LINEAR_API_TOKEN:
        required: true
      CADENCE_APP_PRIVATE_KEY:
        required: true
    inputs:
      helpers-ref:
        description: "Reviewed symphony-client-workflows revision providing the trusted review helpers."
        type: string
        required: false
        default: alpha
  workflow_run:
    workflows:
      [Cadence AI Review Events, Cadence AI Review Trigger, Cadence AI Review]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  pointers:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      contains(fromJSON('["workflow_run","workflow_dispatch","pull_request_target"]'), github.event.workflow_run.event)
    environment: cadence-controller
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      numbers: ${{ steps.pointers.outputs.numbers }}
    steps:
      - name: Find this attempt's recovery pointers
        id: pointers
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: run.id, per_page: 100,
            });
            const prefix = `cadence-check-${run.run_attempt}-`;
            const numbers = artifacts.filter(item => !item.expired && item.name.startsWith(prefix))
              .map(item => item.name.slice(prefix.length)).filter(number => /^[1-9][0-9]*$/.test(number));
            core.setOutput('numbers', JSON.stringify([...new Set(numbers)]));

  cleanup:
    needs: pointers
    if: needs.pointers.outputs.numbers != '[]' && needs.pointers.outputs.numbers != ''
    environment: cadence-controller
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        number: ${{ fromJSON(needs.pointers.outputs.numbers) }}
    concurrency:
      group: cadence-check-publication-${{ github.repository }}-pr-${{ matrix.number }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out trusted helpers
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: 1000lines/symphony-client-workflows
          ref: ${{ inputs.helpers-ref || 'alpha' }}
          persist-credentials: false
      - name: Download recovery pointers as data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: cadence-check-${{ github.event.workflow_run.run_attempt }}-${{ matrix.number }}
          path: ${{ runner.temp }}/cadence-check-pointers
      - name: Mint existing Cadence App token
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.1
        with:
          app-id: ${{ vars.CADENCE_APP_ID }}
          private-key: ${{ secrets.CADENCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-pull-requests: write
      - name: Close checks whose run ended without publication
        env:
          LINEAR_API_TOKEN: ${{ secrets.CADENCE_LINEAR_API_TOKEN }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { recoverCheck } = await import(`${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/cadence-review-check.mjs`);
            const { publishRequestComment } = await import(`${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/cadence-review-comment.mjs`);
            const fs = require('node:fs');
            const directory = `${process.env.RUNNER_TEMP}/cadence-check-pointers`;
            for (const file of fs.readdirSync(directory)) {
              const request = JSON.parse(fs.readFileSync(`${directory}/${file}`, 'utf8'));
              if (String(request.number) !== '${{ matrix.number }}') throw new Error('Recovery pointer does not match the locked PR');
              await recoverCheck(github, context, request, '${{ vars.CADENCE_APP_ID }}', context.payload.workflow_run);
              await publishRequestComment(github, request, { id: '${{ vars.CADENCE_APP_ID }}', slug: '${{ steps.app-token.outputs.app-slug }}' });
              const { routeCheckHandoff, renderReviewHandoffEvidence } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/cadence-linear-rework.mjs`);
              const handoff = await routeCheckHandoff({ github, request,
                app: { id: '${{ vars.CADENCE_APP_ID }}', slug: '${{ steps.app-token.outputs.app-slug }}' },
                token: process.env.LINEAR_API_TOKEN, githubToken: '${{ steps.app-token.outputs.token }}' });
              await core.summary.addRaw(renderReviewHandoffEvidence(handoff)).write();
              if (handoff.operation === 'failed' || handoff.evidenceError) core.setFailed(handoff.error || handoff.evidenceError);
            }
